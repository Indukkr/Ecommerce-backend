spring:
  datasource:
    url: jdbc:mysql://catalog-mysql:3306/${CATALOG_DATABASE}
    username: ${CATALOG_USER}
    password: ${CATALOG_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true